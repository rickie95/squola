name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: default

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backup database
        run: |
          mkdir -p ~/squolabk/
          if [ -f ~/squolabk/current.db]; then
            cp ~/squolabk/current.db ~/squolabk/$(date +%Y-%m-%d_%H-%M).db
            echo "Database backed up successfully."
          else
            echo "No database file found at ~/squolabk/current.db, skipping backup."
          fi

      - name: Deploy stack
        run: docker compose up --build --detach
