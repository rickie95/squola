[project]
name = "squola"
version = "0.1.0"
description = "School scheduling application to help teachers create arrangements efficiently"
readme = "README.md"
authors = [
    { name = "Riccardo Malavolti", email = "riccardo.malavolti@roguewavesai.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "ortools>=9.8.0",
    "alembic>=1.18.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
squola = "squola:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
